name: RPM Build

on:
  push:
    paths:
      - "rpm/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "rpm/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: build RPM package
      id: rpm
      uses: naveenrajm7/rpmbuild@master
      with:
        spec_file: "gpd-pocket4-config.spec"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gpd-pocket4-config
        path: |
          ${{ steps.rpm.outputs.rpm_dir_path }}/**/*.rpm
          ${{ steps.rpm.outputs.source_rpm_dir_path }}/*.rpm
        if-no-files-found: error
        retention-days: 30
