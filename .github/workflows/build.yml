name: Build RPM

on:
  push:
    paths:
      - "scripts/**"
      - "systemd/**"
      - "package.yaml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "systemd/**"
      - "package.yaml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM
        id: pkg
        uses: kentik/pkg@v1.0.0-rc8
        with:
          name: gpd-pocket4-config
          version: 0.0.1
          arch: x86_64
          format: rpm
          package: package.yaml 
 
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpd-pocket4-config
          path: ${{ steps.pkg.outputs.package }}
          if-no-files-found: error
          retention-days: 30
